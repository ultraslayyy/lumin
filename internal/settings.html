<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Lumin Settings</title>
  <link rel="stylesheet" href="https://lumin.local/internal.css">
</head>

<body>
  <div class="container">
    <h1>Lumin Settings</h1>
    <button onclick="requestBookmarks()">Load Bookmarks</button>
    <pre id="out"></pre>
  </div>
  <script>
    function requestBookmarks() {
      window.chrome.webview.postMessage(JSON.stringify({ action: 'getBookmarks' }));
    }
    window.chrome.webview.addEventListener('message', e => {
      const data = e.data;
      document.getElementById('out').innerText = JSON.stringify(data, null, 2);
    });
  </script>
</body>

</html>
